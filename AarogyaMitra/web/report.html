<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   AarogyaMitra &mdash; Health Report
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&amp;family=DM+Sans:opsz,wght@9..40,300;400;500;600&amp;display=swap" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
  <script src="config.js">
  </script>
  <link href="assets/aarogyamitra-logo.png" rel="icon" type="image/png"/>
 </head>
 <body>
  <div class="page active" id="page-result">
   <div class="result-topbar">
    <a class="result-logo" href="dashboard.html">
     <img alt="AarogyaMitra logo" class="brand-logo-img" src="assets/aarogyamitra-logo.png"/>
     <img alt="AarogyaMitra" class="brand-name-img" src="assets/aarogyamitra-text.png"/>
    </a>
    <div class="result-actions">
      <button class="btn-ghost btn-sm report-desktop-action" type="button" onclick="window.location.href='dashboard.html'">
       ✕ Dashboard
      </button>
      <button class="btn-ghost btn-sm report-desktop-action" type="button" onclick="window.location.href='assessment.html'">
       &larr; Edit Inputs
      </button>
      <button class="btn-primary btn-sm report-desktop-action" type="button" onclick="window.print()">
       Print / Save PDF
      </button>
      <button class="report-menu-toggle" id="reportMenuToggle" type="button" aria-label="Open report actions" aria-expanded="false" aria-controls="reportSidePanel">
        <span></span><span></span><span></span>
     </button>
    </div>
   </div>
    <aside class="report-side-panel" id="reportSidePanel" aria-hidden="true">
     <button class="btn-ghost btn-sm" id="dashboardBtn" type="button">
      ✕ Dashboard
     </button>
     <button class="btn-ghost btn-sm" id="editInputsBtn" type="button">
      &larr; Edit Inputs
     </button>
     <button class="btn-primary btn-sm" id="printReportBtn" type="button">
      Print / Save PDF
     </button>
    </aside>
   <div class="result-body" id="resultBody">
   </div>
  </div>
  <div class="toast" id="toast" style="display:none">
  </div>
  <script src="report.js?v=22">
  </script>
 </body>
</html>
