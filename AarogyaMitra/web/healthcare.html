<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Healthcare Finder &mdash; AarogyaMitra
  </title>
  <link href="style.css" rel="stylesheet"/>
  <script src="config.js">
  </script>
  <link href="assets/aarogyamitra-logo.png" rel="icon" type="image/png"/>
 </head>
 <body>
  <header class="portal-nav">
   <div class="nav-inner">
    <a class="nav-logo" href="dashboard.html">
     <img alt="AarogyaMitra logo" class="brand-logo-img" src="assets/aarogyamitra-logo.png"/>
     <img alt="AarogyaMitra" class="brand-name-img" src="assets/aarogyamitra-text.png"/>
    </a>
    <div class="portal-links">
     <a href="dashboard.html">
      Dashboard
     </a>
     <a href="chat.html">
      AI Chat
     </a>
     <a href="assessment.html">
      Assessment
     </a>
     <a href="public-health.html">
      Public Health
     </a>
     <a href="health-record.html">
      Health Record
     </a>
     <a href="vaccination.html">
      Vaccination
     </a>
     <a href="healthcare.html">
      Healthcare
     </a>
     <a href="profile.html">
      Profile
     </a>
     <button class="btn-ghost btn-sm" id="logoutBtn">
      Logout
     </button>
    </div>
   </div>
  </header>
  <main class="portal-container">
   <div class="portal-kicker">
    Location Service
   </div>
   <h1 class="portal-h1">
    Find Nearby Healthcare
   </h1>
   <p class="portal-muted">
    Smart routing ranks up to 3 nearby care options by distance, facility type and relevance.
   </p>
   <div class="search-panel-portal" style="margin-top:24px">
    <input id="locationInput" placeholder="City, district, village or area"/>
    <select id="serviceInput">
     <option value="doctor">
      Doctor
     </option>
     <option value="hospital">
      Hospital
     </option>
     <option value="clinic">
      Clinic
     </option>
     <option value="vaccination centre">
      Vaccination Centre
     </option>
     <option value="diagnostic centre">
      Diagnostic Centre
     </option>
     <option value="primary health centre">
      Primary Health Centre
     </option>
    </select>
    <button class="btn-primary" id="searchHealthcare">
     Search
    </button>
   </div>
   <div class="result-panel-portal" id="healthcareResult">
    Enter a location to search.
   </div>
  </main>
  <script src="portal.js">
  </script>
  <script src="healthcare.js">
  </script>
 </body>
</html>
